# What a correct fill of each bench scenario looks like (bench/site). Values come from profile.yaml.
# A plain value must match exactly (after trimming). Rules:
#   {digits: "..."}      the digits in the value equal this
#   {number: 6}          the value parses to this number
#   {contains: "..."}    the value contains this (case-insensitive)
#   {set: [...]}         a list with exactly these items, any order
#   {value: "..."}       a picked option whose stored value is this
#   {suffix: ".pdf"}     the value ends with this
#   {next_monday: true}  dd/mm/yyyy of the Monday of next week ("earliest start: immediately" in profile.yaml)
#   {entries: [...]}     list of entry cards; each listed entry must be there with these fields, and nothing else
#   absent               the field is empty or missing (optional box left blank / not revealed)

