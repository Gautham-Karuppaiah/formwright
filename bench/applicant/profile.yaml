    description: >-
      Ran penetration tests on internal web applications and wrote up each finding with a fix. Completed practice
      challenges on TryHackMe. Set up an open-source SIEM for log monitoring and alerts. Worked across Ubuntu, Arch,
      Kali Linux and Windows Server.
  - title: ML Intern
    company: Bluefin Analytics Solutions & Technologies
    location: "Dubai, UAE"
    start: 2024-06
    end: 2024-08
    description: >-
      Built and compared regression and neural network models for demand forecasting, including linear and
      polynomial regression, scikit-learn MLP regressors and TensorFlow Sequential models.
  - title: Cloud Computing Intern
    company: Kaveri Finance Services Ltd.
    location: "Chennai, India"
    start: 2024-08
    end: 2024-08
    description: >-
      Worked on AWS infrastructure: EC2 instances and load balancer setup for Nginx web servers.

