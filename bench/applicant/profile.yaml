# Expected salary / expected CTC. Answer in LPA (lakh rupees per year) unless the box asks for another unit.
#  - The job LISTING (the job description, not the form) states a pay range -> the midpoint of that range,
#    rounded to 0.5 LPA. The minimum and maximum of a slider, a number box or a dropdown are the box's limits,
#    never a pay range: they say nothing about what the job pays.
#  - Otherwise -> 5 LPA. A free-text box may say "5 LPA (negotiable)".
#  - A box that asks for a range (two boxes, or a slider with two handles) -> the listing's range if it states
#    one, else 5 to 8 LPA.
#  - A dropdown of bands -> the band that contains 5 LPA.
#  - Pay in a currency other than INR, or a job outside India -> ask the applicant the first time.
expected_ctc:
  default_lpa: 5
  default_range_lpa: [5, 8]

# Where he can work. He can work in ANY city or country. Two different questions, two answers:
#  - "Which locations can you work in / are you willing to relocate to / select all that apply" -> every
#    location offered (tick them all). willing_to_relocate: true. Remote: yes.
#  - "Preferred location" (asks for one, or for a ranking) -> the listing's own city if offered, else Chennai,
#    else Bangalore (Bengaluru), then the rest in the order shown.
location_preference:
  can_work_in: anywhere
  willing_to_relocate: true
  preferred_order: [the listing's own city, Chennai, Bangalore]
  remote_ok: true
  office_days_per_week: 5     # fine with full-time in the office

source_answer:
  # "How did you hear about us?" -> first option that exists
  prefer: [LinkedIn, Job Board, Company Website, Other]

# From the resume. All internships are over: none is current ("Present" / "currently work here" is wrong).
# An entry whose start and end are the same month (Kaveri Finance): enter the real dates (August 2024 to August
# 2024). ONLY when the form refuses them (shows an error like "start date must be before end date"), change the end
# to the next month (Kaveri Finance: September 2024). Never change it before the form has refused.
# description: the applicant's own text for a "role / job description" or "responsibilities" box of that entry,
#   copied as written (full text, it carries the keywords recruiters search). Only when the box has a length
#   limit: shorten it by keeping the first line and the bullets that fit, never rewording.
experience:
  - title: Software Developer Intern
    company: Halcyon Byteworks
    location: "Dubai, UAE"
    start: 2026-01
    end: 2026-07
    description: |-
      Built a floor-plan fixture counter (45 minutes → 4 minutes per sheet) and a tool that sorts supplier price lists.

      Floor-Plan Fixture Counter
      - Found 99% of marked fixtures at any rotation by matching vector outlines instead of pixels
      - Rendered large sheets as tiles off the UI thread, with coarser tiles shown while finer ones load
      - Exported counts as spreadsheets broken down by building, floor and room
      - Kept each project in one portable SQLite file, source drawings included
      - Ported it to the browser in React and TypeScript, rendering sheets in a WebAssembly worker

      Price List Sorter
      - Read supplier price lists from CSVs and PDFs and matched items across suppliers by model number
      - Flagged price changes between list versions and exported a comparison sheet
