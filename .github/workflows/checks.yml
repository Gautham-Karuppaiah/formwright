name: checks
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . playwright
      - run: patchright install --with-deps chromium
      - run: npm ci
        working-directory: bench/site
      - run: python -m unittest discover -s tests -v
        env:
          FORMWRIGHT_BROWSER_TESTS: '1'
